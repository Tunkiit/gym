name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tạo config.js từ Secret BAI_KEY (key không bao giờ nằm trong repo)
      - name: Inject API key
        run: |
          cat > config.js <<EOF
          window.AI_CONFIG = {
            key: '${{ secrets.BAI_KEY }}',
            endpoint: 'https://api.b.ai/v1',
            model: 'deepseek-v4-flash',
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
